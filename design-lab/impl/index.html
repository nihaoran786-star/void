<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void · 实装验证舱 — 导航顶栏 + 团队 Ops Map</title>
<link rel="stylesheet" href="impl.css" />
<style>
  /* ThemeService 运行时终端值(tokens.scss 兼容别名由 JS 主题服务写入,这里静态补齐) */
  :root {
    --nav-font-size-2xs: 11px; --nav-font-size-xs: 12px; --nav-font-size-sm: 13px; --nav-font-size-base: 14px;
    --font-size-2xs: 11px; --font-size-xs: 12px; --font-size-sm: 13px; --font-size-base: 14px;
    --font-size-lg: 16px; --font-size-xl: 20px; --font-size-2xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-family-sans); background: var(--color-bg-scene); color: var(--color-text-primary); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  .harness { display: flex; height: 100vh; overflow: hidden; }
  .harness__nav { width: 248px; flex: 0 0 248px; min-height: 0; }
  .harness__nav .void-nav-panel { height: 100%; }
  .harness__canvas { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); font-size: 12px; letter-spacing: .12em; opacity: .55; }
  .harness__team { width: 368px; flex: 0 0 368px; min-height: 0; border-left: 1px solid var(--border-subtle); }
  .harness__team .team-workspace-panel { height: 100%; }
</style>
</head>
<body class="void-ui--minimal">
<div class="harness">

  <!-- ════ 左侧:真实 NavPanel 顶栏 DOM(minimal) ════ -->
  <div class="harness__nav">
    <nav class="void-nav-panel" aria-label="主导航">
      <div class="void-nav-panel__top-actions">
        <div class="void-nav-panel__session-create void-nav-panel__session-create--minimal">
          <div class="void-nav-panel__session-create-footer">
            <button type="button" class="void-nav-panel__session-create-action" aria-label="新建任务">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <span class="void-nav-panel__session-create-action-text">新建任务</span>
              <kbd class="void-nav-panel__session-create-action-kbd">Ctrl+N</kbd>
            </button>
            <div class="void-nav-panel__session-search-slot">
              <button type="button" class="void-nav-panel__search-trigger" aria-label="搜索会话、文件与命令">
                <span class="void-nav-panel__search-trigger__icon" aria-hidden="true">
                  <span class="void-nav-panel__search-trigger__icon-inner">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                  </span>
                </span>
                <span class="void-nav-panel__search-trigger__label">搜索</span>
                <kbd class="void-nav-panel__search-trigger__kbd">Ctrl+K</kbd>
              </button>
            </div>
          </div>
        </div>

        <button type="button" class="void-nav-panel__top-action-btn" aria-label="助理">
          <span class="void-nav-panel__top-action-icon-slot" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <span>助理</span>
        </button>
        <button type="button" class="void-nav-panel__top-action-btn is-active" aria-label="自动化">
          <span class="void-nav-panel__top-action-icon-slot" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></svg>
          </span>
          <span>自动化</span>
        </button>
        <div class="void-nav-panel__top-action-expand">
          <button type="button" class="void-nav-panel__top-action-btn void-nav-panel__top-action-btn--expand is-open" aria-expanded="true" aria-controls="void-nav-panel-extensions" aria-label="定制">
            <span class="void-nav-panel__top-action-expand-icons" aria-hidden="true">
              <svg class="void-nav-panel__top-action-expand-icon-default" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <svg class="void-nav-panel__top-action-expand-icon-chevron is-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </span>
            <span>定制</span>
          </button>
          <div id="void-nav-panel-extensions" class="void-nav-panel__top-action-sublist is-open">
            <button type="button" class="void-nav-panel__top-action-btn void-nav-panel__top-action-btn--sub" aria-label="智能体">
              <span class="void-nav-panel__top-action-icon-slot" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </span>
              <span>智能体</span>
            </button>
            <button type="button" class="void-nav-panel__top-action-btn void-nav-panel__top-action-btn--sub" aria-label="技能">
              <span class="void-nav-panel__top-action-icon-slot" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4v4a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-4H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2z"/></svg>
              </span>
              <span>技能</span>
            </button>
            <button type="button" class="void-nav-panel__top-action-btn void-nav-panel__top-action-btn--sub" aria-label="连接器">
              <span class="void-nav-panel__top-action-icon-slot" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c4-1 5-8 8-8s4 7 8 6"/><circle cx="4" cy="17" r="2"/><circle cx="20" cy="15" r="2"/></svg>
              </span>
              <span>连接器</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <div class="harness__canvas">画布区</div>

  <!-- ════ 右侧:真实 TeamWorkspacePanel DOM(Ops Map) ════ -->
  <div class="harness__team" id="team-host"></div>

<script>
  /* 与 TeamWorkspacePanel.tsx 完全一致的布局/相机逻辑 */
  const MAP_MIN_ZOOM = 0.6, MAP_MAX_ZOOM = 1.8, MAP_ORBIT_SQUASH = 0.78;
  function memberOrbitRadius(count) { if (count <= 4) return 150; if (count <= 6) return 180; return 205; }
  function memberPosition(index, count) {
    const radius = memberOrbitRadius(count);
    const angle = ((-90 + (360 / count) * index) * Math.PI) / 180;
    return { x: Math.round(Math.cos(angle) * radius), y: Math.round(Math.sin(angle) * radius * MAP_ORBIT_SQUASH) };
  }

  const ALL_MEMBERS = [
    { name: '苏婉清扬', role: '前端工程师', tone: 'info' },
    { name: '陈默', role: '视觉设计师', tone: 'success' },
    { name: '欧阳娜丽莎', role: '数据分析师', tone: 'warning' },
    { name: '赵一鸣', role: '质量保障', tone: 'neutral' },
    { name: '何雨桐', role: '文案策划', tone: 'info' },
    { name: '司马长风破浪', role: '后端架构师', tone: 'neutral' },
    { name: '林小满', role: '测试工程师', tone: 'success' },
    { name: '诸葛云溪', role: '运维专家', tone: 'error' },
  ];
  const STATUS_LABEL = { info: '工作中', success: '已完成', warning: '等待中', error: '失败', neutral: '待命' };

  const params = new URLSearchParams(location.search);
  const count = Math.min(8, Math.max(1, parseInt(params.get('n') || '6', 10)));
  const members = ALL_MEMBERS.slice(0, count);

  const host = document.getElementById('team-host');
  const panelHeight = host.clientHeight || 800;
  const radius = memberOrbitRadius(members.length);
  const kx = (368 - 48) / (2 * (radius + 60));
  const ky = (panelHeight - 140) / (2 * (radius * MAP_ORBIT_SQUASH + 66));
  const k = params.has('k') ? parseFloat(params.get('k')) : Math.min(1, Math.max(MAP_MIN_ZOOM, Math.min(kx, ky)));
  const cam = { x: parseFloat(params.get('x') || '0'), y: parseFloat(params.get('y') || '12'), k };
  const transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.k})`;

  const wires = members.map((m, i) => {
    const p = memberPosition(i, members.length);
    return `<line x1="0" y1="0" x2="${p.x}" y2="${p.y}"${m.tone === 'info' ? ' class="is-hot"' : ''} vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const nodes = members.map((m, i) => {
    const p = memberPosition(i, members.length);
    const ripples = m.tone === 'info' ? '<span class="team-workspace-panel__map-member-ripples"><i></i><i></i></span>' : '';
    return `<button type="button" class="team-workspace-panel__map-member" data-tone="${m.tone}"
        style="transform: translate(${p.x}px, ${p.y}px) scale(calc(1 / var(--map-camera-zoom, 1)))"
        aria-label="查看${m.name}的会话">
      <span class="team-workspace-panel__map-member-orb" aria-hidden="true">${ripples}${m.name.slice(0, 1)}<span class="team-workspace-panel__map-member-dot"></span></span>
      <span class="team-workspace-panel__map-member-name">${m.name}</span>
      <span class="team-workspace-panel__map-member-role">${m.role}</span>
      <span class="sr-only">${STATUS_LABEL[m.tone]}</span>
    </button>`;
  }).join('');

  host.innerHTML = `
  <aside class="team-workspace-panel" aria-label="团队工作区">
    <header class="team-workspace-panel__header">
      <span class="team-workspace-panel__identity">
        <strong>电商大促作战室</strong>
        <span class="team-workspace-panel__status" data-tone="info" role="status" aria-live="polite"><i aria-hidden="true"></i>运行中</span>
      </span>
      <button type="button" class="team-workspace-panel__icon-button" aria-label="关闭团队工作区">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <div class="team-workspace-panel__map">
      <div class="team-workspace-panel__map-grid" style="transform: ${transform}" aria-hidden="true"></div>
      <section class="team-workspace-panel__map-world" style="transform: ${transform}; --map-camera-zoom: ${cam.k}" aria-labelledby="team-workspace-members">
        <strong id="team-workspace-members" class="sr-only">团队成员</strong>
        <svg class="team-workspace-panel__map-wires" aria-hidden="true">${wires}</svg>
        <div class="team-workspace-panel__map-lead" style="transform: scale(calc(1 / var(--map-camera-zoom, 1)))">
          <span class="team-workspace-panel__map-lead-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.735H5.81a1 1 0 0 1-.957-.735L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
          </span>
          <span class="team-workspace-panel__map-lead-name">主理人</span>
        </div>
        ${nodes}
      </section>
      <section class="team-workspace-panel__map-mission" aria-labelledby="team-workspace-overview" data-map-static>
        <small id="team-workspace-overview">当前工作</small>
        <strong>大促交付流程</strong>
        <p>完成双十一大促首页改版与投放素材交付</p>
      </section>
      <div class="team-workspace-panel__map-hud" data-map-static>
        <span>${Math.round(cam.k * 100)}%</span>
        <button type="button">复位视图</button>
      </div>
      <section class="team-workspace-panel__map-phases" aria-labelledby="team-workspace-phases" data-map-static>
        <span class="team-workspace-panel__map-phases-cap" id="team-workspace-phases">工作阶段</span>
        <ol class="team-workspace-panel__map-segbar">
          <li data-tone="success"><span class="sr-only">需求分析 · 已完成</span></li>
          <li data-tone="success"><span class="sr-only">素材生产 · 已完成</span></li>
          <li data-tone="info"><span class="sr-only">开发实现 · 进行中</span></li>
          <li data-tone="neutral"><span class="sr-only">验收交付 · 待开始</span></li>
        </ol>
        <span class="team-workspace-panel__map-phases-label"><strong>开发实现</strong>2/4</span>
        <span class="team-workspace-panel__map-updated">更新于 14:32</span>
      </section>
    </div>
  </aside>`;
</script>
</body>
</html>
