<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>左边栏 · 曜岩/霜白 重设计</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  background: #0a0a0b; color: #e8e8e6;
  padding: 48px 32px 80px;
  font-synthesis: none; -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }

.page-head { max-width: 1240px; margin: 0 auto 36px; }
.page-head h1 { font-size: 20px; font-weight: 600; }
.page-head p { margin-top: 8px; font-size: 12.5px; color: #8a8a86; line-height: 1.8; }
.page-head b { color: #c9c9c4; font-weight: 600; }

.cols { display: flex; gap: 28px; justify-content: center; max-width: 1240px; margin: 0 auto; flex-wrap: wrap; }
.col { flex: 1 1 560px; max-width: 592px; display: flex; flex-direction: column; gap: 18px; }
.col-head { font-size: 13px; font-weight: 600; letter-spacing: .06em; }
.col-head span { font-weight: 400; color: #7d7d78; font-size: 11.5px; margin-left: 8px; letter-spacing: 0; }

.demo { border-radius: 20px; padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 14px; }
.demo-row { display: flex; gap: 18px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.demo-cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.demo-cap h3 { font-size: 12px; font-weight: 600; letter-spacing: .05em; }
.demo-cap .note { font-size: 10.5px; color: #7d7d78; }
.play {
  border: 0; background: none; cursor: pointer; font: inherit;
  font-size: 11px; color: var(--p-accent, #d4ff00); padding: 2px 0;
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.play:hover { border-bottom-color: currentColor; }

/* ============ 主题变量:曜岩 / 霜白 ============ */
.dark { --p-bg: #0c0c0c; --p-panel: #0a0a0a; --p-card: #101010; --p-border: rgba(255,255,255,.09); --p-text: #f0f0f0; --p-dim: rgba(240,240,240,.52); --p-faint: rgba(240,240,240,.25); --p-accent: #d4ff00; }
.dark .demo { background: #050505; }
.light { --p-bg: #fbf9f5; --p-panel: #f5f2ec; --p-card: #ffffff; --p-border: rgba(10,10,12,.1); --p-text: #0a0a0c; --p-dim: rgba(10,10,12,.58); --p-faint: rgba(10,10,12,.34); --p-accent: #000bbf; }
.light .demo { background: #efeae2; }
.light .play { color: var(--p-accent); }
</style>
<style>
/* ================================================================
   左边栏 · 完整形态
   语言:点状态 / 发丝线 / mono 细节 / 一个主动作,其余全部安静
   ================================================================ */
.nav {
  width: 264px; flex: 0 0 auto;
  background: var(--p-panel);
  border: 1px solid var(--p-border);
  border-radius: 14px;
  color: var(--p-text);
  display: flex; flex-direction: column;
  overflow: hidden;
  font-size: 12px;
}

/* ── 搜索:一行,无框,kbd 是唯一的 mono 暗示 ── */
.nav-search {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 10px;
  color: var(--p-faint); font-size: 11.5px;
  cursor: pointer; border-bottom: 1px solid var(--p-border);
  transition: color .2s ease;
}
.nav-search:hover { color: var(--p-dim); }
.nav-search svg { flex: 0 0 auto; }
.nav-search .kbd {
  margin-left: auto; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 9px; letter-spacing: .08em; color: var(--p-faint);
  border: 1px solid var(--p-border); border-radius: 3px; padding: 1px 4px;
}

/* ── 主动作:唯一的重色,其余导航全部安静 ── */
.nav-primary {
  display: flex; align-items: baseline; gap: 8px;
  margin: 10px 14px 2px; padding: 7px 0;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  color: var(--p-text);
  transition: color .2s ease;
}
.nav-primary .plus { color: var(--p-accent); display: flex; align-items: center; }
.nav-primary .mode {
  margin-left: auto; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 8.5px; letter-spacing: .18em; color: var(--p-faint);
  transition: color .2s ease;
}
.nav-primary:hover .mode { color: var(--p-accent); }

/* ── 安静导航行:点 + 文字,hover 才亮 ── */
.nav-rows { padding: 2px 14px 6px; display: flex; flex-direction: column; }
.nrow {
  position: relative;
  display: flex; align-items: center; gap: 9px;
  padding: 5px 0 5px 2px;
  color: var(--p-dim); font-size: 12px; cursor: pointer;
  transition: color .18s ease;
  user-select: none;
}
.nrow .nd {
  width: 5px; height: 5px; border-radius: 50%;
  border: 1px solid var(--p-faint);
  flex: 0 0 auto;
  transition: background-color .18s ease, border-color .18s ease;
}
.nrow > svg { flex: 0 0 auto; color: var(--p-faint); transition: color .18s ease; }
.nrow:hover { color: var(--p-text); }
.nrow:hover .nd { border-color: var(--p-dim); }
.nrow:hover > svg { color: var(--p-dim); }
.nrow.is-active { color: var(--p-text); }
.nrow.is-active .nd { background: var(--p-accent); border-color: var(--p-accent); }
.nrow.is-active > svg { color: var(--p-accent); }
.nrow.is-active::before {
  content: ""; position: absolute; left: -14px; top: 6px; bottom: 6px; width: 1px;
  background: var(--p-accent);
}
.nrow .nmeta {
  margin-left: auto; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 8.5px; letter-spacing: .14em; color: var(--p-faint);
}
.nrow .chev { transition: transform .25s cubic-bezier(.22,1,.36,1); color: var(--p-faint); }
.nrow.is-open .chev { transform: rotate(90deg); }

/* ── 扩展子列表:发丝缩进,无卡片 ── */
.nsub {
  display: none;
  margin: 1px 0 3px 4px; padding-left: 9px;
  border-left: 1px solid var(--p-border);
  flex-direction: column;
}
.nsub.is-open { display: flex; }
.nsub .nrow { font-size: 11.5px; padding: 4px 0 4px 2px; }

/* ── 分区头:mono 小标签 + 发丝线 + 计数 ── */
.nsec {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 14px 2px;
  cursor: pointer; user-select: none;
}
.nsec .nl {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 9px; letter-spacing: .2em; color: var(--p-faint);
  transition: color .2s ease;
}
.nsec:hover .nl { color: var(--p-dim); }
.nsec .hline { flex: 1; height: 1px; background: var(--p-border); }
.nsec .nc {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 9px; letter-spacing: .1em; color: var(--p-faint);
}
.nsec .nplus {
  border: 0; background: none; color: var(--p-faint); cursor: pointer;
  font: inherit; font-size: 12px; line-height: 1; padding: 0 1px;
  transition: color .18s ease;
}
.nsec .nplus:hover { color: var(--p-accent); }
.nsec .chev { transition: transform .25s cubic-bezier(.22,1,.36,1); color: var(--p-faint); display: flex; }
.nsec.is-closed .chev { transform: rotate(-90deg); }

/* ── 会话行:状态点 + 单行标题 + mono 时间 ── */
.nlist { padding: 2px 14px 4px; display: flex; flex-direction: column; }
.nlist.is-closed { display: none; }
.nagent {
  padding: 5px 0 1px 2px;
  font-size: 10.5px; color: var(--p-faint); letter-spacing: .04em;
}
.srow {
  position: relative;
  display: flex; align-items: center; gap: 9px;
  padding: 5px 0 5px 2px;
  cursor: pointer;
  transition: opacity .2s ease;
}
.srow .st { position: relative; width: 6px; height: 6px; flex: 0 0 auto; }
/* 静态:空发丝圈 */
.srow[data-st="idle"] .st { border: 1px solid var(--p-faint); border-radius: 50%; }
/* 运行:accent 点 + 单圈涟漪 */
.srow[data-st="run"] .st { background: var(--p-accent); border-radius: 50%; }
.srow[data-st="run"] .st::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1px solid var(--p-accent);
  animation: srip 1.8s cubic-bezier(.2,.6,.3,1) infinite;
}
@keyframes srip { 0% { opacity: .7; transform: scale(.7); } 100% { opacity: 0; transform: scale(2.2); } }
.srow .ttl {
  flex: 1; min-width: 0;
  font-size: 12px; color: var(--p-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .18s ease;
}
.srow:hover .ttl { color: var(--p-text); }
.srow.is-active .ttl { color: var(--p-text); font-weight: 550; }
.srow.is-active::before {
  content: ""; position: absolute; left: -14px; top: 5px; bottom: 5px; width: 1px;
  background: var(--p-accent);
}
.srow .ms {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 8.5px; letter-spacing: .08em; color: var(--p-faint);
  flex: 0 0 auto;
}
.srow[data-st="run"] .ms { color: var(--p-accent); }
/* 运行会话:行下发丝进度 */
.srow .track { position: absolute; left: 17px; right: 0; bottom: 1px; height: 1px; background: var(--p-border); display: none; }
.srow[data-st="run"] .track { display: block; }
.srow .track i { position: absolute; left: 0; top: -0.5px; height: 2px; width: 0; background: var(--p-accent); transition: width .5s cubic-bezier(.22,1,.36,1); }

/* ── 底栏:发丝线之上的一行 ── */
.nav-foot {
  margin-top: auto;
  border-top: 1px solid var(--p-border);
  padding: 9px 14px 10px;
  display: flex; align-items: center; gap: 9px;
  color: var(--p-dim); font-size: 11.5px; cursor: pointer;
  transition: color .18s ease;
}
.nav-foot:hover { color: var(--p-text); }
.nav-foot .nd { width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--p-faint); }
.nav-foot .nmeta { margin-left: auto; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 8.5px; letter-spacing: .14em; color: var(--p-faint); }

/* ================================================================
   左边栏 · 专注轨(收起态):44px,只剩点
   ================================================================ */
.rail {
  width: 46px; flex: 0 0 auto;
  background: var(--p-panel);
  border: 1px solid var(--p-border);
  border-radius: 14px;
  padding: 12px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rail .rbtn {
  position: relative; width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.rail .rbtn .rd {
  width: 6px; height: 6px; border-radius: 50%;
  border: 1px solid var(--p-faint);
  transition: border-color .18s ease, background-color .18s ease;
}
.rail .rbtn:hover .rd { border-color: var(--p-dim); }
.rail .rbtn.is-active .rd { background: var(--p-accent); border-color: var(--p-accent); }
.rail .rbtn.is-active::before {
  content: ""; position: absolute; left: -10px; top: 5px; bottom: 5px; width: 1px;
  background: var(--p-accent);
}
.rail .rbtn[data-st="run"] .rd { background: var(--p-accent); border-color: var(--p-accent); position: relative; }
.rail .rbtn[data-st="run"] .rd::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--p-accent);
  animation: srip 1.8s cubic-bezier(.2,.6,.3,1) infinite;
}
.rail .rsep { width: 14px; height: 1px; background: var(--p-border); margin: 5px 0; }
.rail .rplus { color: var(--p-faint); font-size: 13px; transition: color .18s ease; }
.rail .rplus:hover { color: var(--p-accent); }
.rail .rsp { flex: 1; }

.rail-cap { text-align: center; font-size: 10px; color: #7d7d78; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
<body>
<header class="page-head">
  <h1>左边栏 — 曜岩 / 霜白</h1>
  <p>设计决策:<b>一个主动作,其余全部安静</b>。四个功能入口用电路/扫描框语言的定制图标(方角端点 + 节点焊点),无图标容器;
  会话与工作区仍是状态点(空圈=静态 / accent 点+涟漪=运行);分区头压成 mono 小标签 + 发丝线;选中态只有一根 1px 左侧光线,没有底色块。<br>
  下方同时给出完整栏与 46px 专注轨两种形态。会话可点击切换;点 ▶ 播放看「会话运行→完成」的安静叙事。</p>
</header>

<div class="cols"></div>

<template id="col-tpl">
  <div class="col-inner">
    <div class="col-head"></div>

    <div class="demo">
      <div class="demo-cap">
        <h3>完整栏 + 专注轨</h3>
        <span class="note">点状态 · 发丝线 · mono 细节</span>
        <button class="play" data-demo="run">▶ 播放</button>
      </div>
      <div class="demo-row">
        <!-- ══ 完整栏 ══ -->
        <nav class="nav" data-nav>
          <div class="nav-search">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>搜索会话、文件、工具</span>
            <kbd class="kbd">⌘K</kbd>
          </div>

          <div class="nav-primary">
            <span class="plus"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="square"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span><span>新建任务</span>
            <span class="mode">CODE · ⌘N</span>
          </div>

          <div class="nav-rows">
            <div class="nrow" data-navrow>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4z"/><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="12" cy="2.8" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="21.2" r="1.3" fill="currentColor" stroke="none"/></svg>
              <span>助手</span>
            </div>
            <div class="nrow" data-navrow>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.2" stroke-dasharray="2.5 3.4"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19.2" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>
              <span>自动化</span><span class="nmeta">03</span>
            </div>
            <div class="nrow" data-ext-toggle>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="9" height="9"/><rect x="12.5" y="12.5" width="8" height="8"/><path d="M12.5 8h2.6M8 12.5v2.6" stroke-linecap="square"/><circle cx="16.5" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="16.5" r="1.4" fill="currentColor" stroke="none"/></svg>
              <span>扩展</span>
              <span class="nmeta" style="margin-left:auto;display:flex;align-items:center">
                <svg class="chev" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
              </span>
            </div>
            <div class="nsub" data-ext-list>
              <div class="nrow" data-navrow><span class="nd"></span><span>智能体</span></div>
              <div class="nrow" data-navrow><span class="nd"></span><span>技能</span></div>
              <div class="nrow" data-navrow><span class="nd"></span><span>连接器</span><span class="nmeta">12</span></div>
            </div>
          </div>

          <div class="nsec" data-sec-toggle>
            <span class="nl">助手会话</span>
            <span class="hline"></span>
            <span class="nc">04</span>
            <span class="chev"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="nlist" data-sec-list>
            <div class="nagent">Kimi · 默认助手</div>
            <div class="srow" data-st="run" data-srow>
              <span class="st"></span>
              <span class="ttl">重构左侧导航的信息架构</span>
              <span class="ms" data-run-ms>12:40</span>
              <span class="track"><i data-run-fill></i></span>
            </div>
            <div class="srow is-active" data-st="idle" data-srow>
              <span class="st"></span>
              <span class="ttl">工具调用动效重构</span>
              <span class="ms">11:05</span>
            </div>
            <div class="srow" data-st="idle" data-srow>
              <span class="st"></span>
              <span class="ttl">短剧分镜 · 第 3 集台词</span>
              <span class="ms">昨天</span>
            </div>
            <div class="srow" data-st="idle" data-srow>
              <span class="st"></span>
              <span class="ttl">团队面板悬浮化评审</span>
              <span class="ms">周一</span>
            </div>
          </div>

          <div class="nsec" data-sec-toggle>
            <span class="nl">工作区</span>
            <span class="hline"></span>
            <span class="nc">02</span>
            <button class="nplus" title="添加工作区" onclick="event.stopPropagation()">+</button>
            <span class="chev"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="nlist" data-sec-list>
            <div class="srow is-active" data-st="idle" data-srow>
              <span class="st"></span>
              <span class="ttl">void-source</span>
              <span class="ms">feat/nav</span>
            </div>
            <div class="srow" data-st="idle" data-srow>
              <span class="st"></span>
              <span class="ttl">kimi-desktop</span>
              <span class="ms">main</span>
            </div>
          </div>

          <div class="nav-foot">
            <span class="nd"></span><span>MiniApp 应用</span>
            <span class="nmeta">08</span>
          </div>
        </nav>

        <!-- ══ 专注轨 ══ -->
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
          <div class="rail" data-rail>
            <div class="rbtn rplus" title="新建任务">+</div>
            <div class="rsep"></div>
            <div class="rbtn" title="助手"><span class="rd"></span></div>
            <div class="rbtn" title="自动化"><span class="rd"></span></div>
            <div class="rbtn" title="扩展"><span class="rd"></span></div>
            <div class="rsep"></div>
            <div class="rbtn" data-st="run" data-rail-run title="重构左侧导航的信息架构 · 运行中"><span class="rd"></span></div>
            <div class="rbtn is-active" title="工具调用动效重构"><span class="rd"></span></div>
            <div class="rbtn" title="短剧分镜"><span class="rd"></span></div>
            <div class="rsep"></div>
            <div class="rbtn is-active" title="void-source"><span class="rd"></span></div>
            <div class="rbtn" title="kimi-desktop"><span class="rd"></span></div>
            <div class="rsp"></div>
            <div class="rbtn" title="MiniApp 应用"><span class="rd"></span></div>
          </div>
          <span class="rail-cap">专注轨 46px</span>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
/* 克隆曜岩/霜白两栏 */
const tpl = document.getElementById('col-tpl');
const cols = document.querySelector('.cols');
[['dark', '曜岩', '深色模式'], ['light', '霜白', '浅色模式']].forEach(([cls, name, sub]) => {
  const col = document.createElement('div');
  col.className = `col ${cls}`;
  col.appendChild(tpl.content.cloneNode(true));
  col.querySelector('.col-head').innerHTML = `${name} <span>${sub}</span>`;
  cols.appendChild(col);
});

/* ── 交互:点击切换选中(同一分区内互斥) ── */
document.querySelectorAll('[data-nav]').forEach(nav => {
  nav.querySelectorAll('.nlist').forEach(list => {
    list.querySelectorAll('[data-srow]').forEach(row => {
      row.addEventListener('click', () => {
        list.querySelectorAll('.srow').forEach(r => r.classList.remove('is-active'));
        row.classList.add('is-active');
      });
    });
  });
  nav.querySelectorAll('[data-navrow]').forEach(row => {
    row.addEventListener('click', () => {
      nav.querySelectorAll('.nav-rows .nrow').forEach(r => r.classList.remove('is-active'));
      row.classList.add('is-active');
    });
  });
  /* 扩展子列表 */
  const extToggle = nav.querySelector('[data-ext-toggle]');
  const extList = nav.querySelector('[data-ext-list]');
  extToggle.addEventListener('click', () => {
    extToggle.classList.toggle('is-open');
    extList.classList.toggle('is-open');
  });
  /* 分区折叠 */
  nav.querySelectorAll('[data-sec-toggle]').forEach(sec => {
    sec.addEventListener('click', () => {
      sec.classList.toggle('is-closed');
      sec.nextElementSibling.classList.toggle('is-closed');
    });
  });
});

/* ── 播放:运行中的会话安静收尾 ── */
document.querySelectorAll('[data-demo="run"]').forEach(btn => {
  btn.addEventListener('click', () => {
    const demo = btn.closest('.demo');
    const row = demo.querySelector('[data-srow][data-st="run"]');
    const railRun = demo.querySelector('[data-rail-run]');
    const fill = row.querySelector('[data-run-fill]');
    const ms = row.querySelector('[data-run-ms]');
    let pct = 12;
    fill.style.width = pct + '%';
    const t0 = performance.now();
    const id = setInterval(() => {
      const s = (performance.now() - t0) / 1000;
      pct = Math.min(100, 12 + s * 30);
      fill.style.width = pct + '%';
      ms.textContent = '12:' + String(40 + Math.floor(s)).padStart(2, '0');
      if (pct >= 100) {
        clearInterval(id);
        row.dataset.st = 'idle';
        ms.textContent = '12:43';
        ms.style.color = '';
        railRun.dataset.st = '';
        setTimeout(() => { fill.style.width = '0'; }, 600);
      }
    }, 100);
  });
});
</script>
</body>
</html>
